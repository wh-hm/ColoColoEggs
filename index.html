<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web育成ゲーム - ペット育成</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 16px;
    }
    .screen {
      background: #f0f8ff;
      border: 3px solid #e0e0e0;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .pet-avatar {
      font-size: 80px;
      transition: transform 0.3s ease;
      user-select: none;
    }
    .pet-avatar.bounce {
      animation: bounce 0.5s ease;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    .status-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .status-item {
      margin-bottom: 10px;
    }
    .status-label {
      font-size: 0.9rem;
      color: #555;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .bar-bg {
      background: #eee;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 50%;
      border-radius: 6px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:active {
      transform: translateY(2px);
    }
    button.play { background: #2196F3; }
    button.sleep { background: #9C27B0; }
    button.reset { background: #f44336; grid-column: span 2; margin-top: 5px; }
    .message-box {
      font-size: 0.9rem;
      color: #444;
      background: #fff8dc;
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 10px;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 id="pet-title">🌱 マイペット</h1>

  <div class="screen">
    <div id="pet-avatar" class="pet-avatar">🥚</div>
    <div class="message-box" id="message">たまごを温めて育てよう！</div>
  </div>

  <div class="status-group">
    <div class="status-item">
      <div class="status-label"><span>おなか</span><span id="val-hunger">50%</span></div>
      <div class="bar-bg"><div id="bar-hunger" class="bar-fill" style="width: 50%; background: #ff9800;"></div></div>
    </div>
    <div class="status-item">
      <div class="status-label"><span>たいりょく</span><span id="val-energy">50%</span></div>
      <div class="bar-bg"><div id="bar-energy" class="bar-fill" style="width: 50%; background: #4caf50;"></div></div>
    </div>
    <div class="status-item">
      <div class="status-label"><span>なつき度</span><span id="val-affection">50%</span></div>
      <div class="bar-bg"><div id="bar-affection" class="bar-fill" style="width: 50%; background: #e91e63;"></div></div>
    </div>
  </div>

  <div class="btn-grid">
    <button class="feed" onclick="feedPet()">🍚 ごはん</button>
    <button class="play" onclick="playPet()">🎾 あそぶ</button>
    <button class="sleep" onclick="sleepPet()">🌙 ねかせる</button>
    <button class="play" onclick="passTime()">⌛ なにもしない</button>
    <button class="reset" onclick="resetPet()">🔄 はじめから</button>
  </div>
</div>

<script>
  // ペットのステータス管理
  let pet = {
    stage: 0, // 0: たまご, 1: こども, 2: おとな
    hunger: 50,
    energy: 50,
    affection: 50,
    turns: 0,
    isAlive: true
  };

  // localStorageからのロード
  function loadGame() {
    const saved = localStorage.getItem('web_pet_save');
    if (saved) {
      pet = JSON.parse(saved);
    }
    updateUI();
  }

  // localStorageへの保存
  function saveGame() {
    localStorage.setItem('web_pet_save', JSON.stringify(pet));
  }

  function getAvatar() {
    if (!pet.isAlive) return '💀';
    if (pet.stage === 0) return '🥚';
    if (pet.stage === 1) return '🐣';
    if (pet.stage === 2) {
      return pet.affection > 70 ? '🦄' : '🐱';
    }
    return '🐣';
  }

  function updateUI() {
    document.getElementById('pet-avatar').innerText = getAvatar();
    
    // ステータス反映
    document.getElementById('val-hunger').innerText = pet.hunger + '%';
    document.getElementById('bar-hunger').style.width = pet.hunger + '%';

    document.getElementById('val-energy').innerText = pet.energy + '%';
    document.getElementById('bar-energy').style.width = pet.energy + '%';

    document.getElementById('val-affection').innerText = pet.affection + '%';
    document.getElementById('bar-affection').style.width = pet.affection + '%';

    saveGame();
  }

  function setMessage(msg) {
    document.getElementById('message').innerText = msg;
    const avatar = document.getElementById('pet-avatar');
    avatar.classList.remove('bounce');
    void avatar.offsetWidth; // trigger reflow
    avatar.classList.add('bounce');
  }

  function feedPet() {
    if (!pet.isAlive) return;
    pet.hunger = Math.min(100, pet.hunger + 30);
    pet.energy = Math.min(100, pet.energy + 5);
    setMessage('ごはんを食べてお腹がいっぱい！');
    passTime(false);
  }

  function playPet() {
    if (!pet.isAlive) return;
    if (pet.energy < 20) {
      setMessage('疲れていて遊べそうにありません…');
      return;
    }
    pet.affection = Math.min(100, pet.affection + 15);
    pet.hunger = Math.max(0, pet.hunger - 15);
    pet.energy = Math.max(0, pet.energy - 20);
    setMessage('元気に遊んで満足そうです！');
    passTime(false);
  }

  function sleepPet() {
    if (!pet.isAlive) return;
    pet.energy = Math.min(100, pet.energy + 40);
    pet.hunger = Math.max(0, pet.hunger - 10);
    setMessage('ぐっすり眠って体力が回復しました！');
    passTime(false);
  }

  function passTime(manual = true) {
    if (!pet.isAlive) return;
    
    pet.turns++;
    pet.hunger = Math.max(0, pet.hunger - 10);

    // 進化ロジック
    if (pet.stage === 0 && pet.turns >= 2) {
      pet.stage = 1;
      setMessage('たまごから赤ちゃんが生まれました！');
    } else if (pet.stage === 1 && pet.turns >= 8) {
      pet.stage = 2;
      setMessage('ペットが大人の姿に進化しました！');
    } else if (manual) {
      setMessage('時間を過ごしました。');
    }

    // 死亡判定
    if (pet.hunger <= 0) {
      pet.energy = Math.max(0, pet.energy - 20);
    }
    if (pet.energy <= 0) {
      pet.isAlive = false;
      setMessage('力尽きてしまいました…');
    }

    updateUI();
  }

  function resetPet() {
    if (confirm('最初からやり直しますか？')) {
      pet = {
        stage: 0,
        hunger: 50,
        energy: 50,
        affection: 50,
        turns: 0,
        isAlive: true
      };
      setMessage('たまごを温めて育てよう！');
      updateUI();
    }
  }

  // 初期化
  loadGame();
</script>

</body>
</html>
